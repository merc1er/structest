name: Lint

on:
  push:
    paths:
      - "**.py"
      - "pyproject.toml"

jobs:
  ruff-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Ruff
        uses: astral-sh/ruff-action@v3

      - name: Run Ruff formatter
        run: ruff format --check .

      - name: Run Ruff linter
        run: ruff check .
